

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    #throwaway DB, destroyed after the run -> a fake secret in the file is fine
    env:
      DATABASE_URL: postgresql+psycopg://maestro:maestro@localhost:5432/maestro_test
      TEST_DATABASE_URL: postgresql+psycopg://maestro:maestro@localhost:5432/maestro_test
      JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: maestro
          POSTGRES_PASSWORD: maestro
          POSTGRES_DB: maestro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maestro -d maestro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: alembic upgrade head
      - run: alembic check   #fails if a model changed without a migration
      - run: pytest -v

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web #every command is defaulted to ~web/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      # - run: npm run lint 
  
  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tuner:ci .
  deploy:
    needs: [build-and-test, test-frontend, test-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy
        run: curl -fsS -X POST "${{ secrets.DEPLOY_HOOK_URL }}"


